# 매일 영상 동기화 — YouTube API → videos upsert + video_no 부여 (SPEC.md §6)
# 필요한 시크릿: DATABASE_URL, YOUTUBE_API_KEY / 변수: YT_CHANNEL (@핸들 또는 UC채널ID)
name: sync-videos
on:
  schedule:
    - cron: '20 19 * * *'   # UTC 19:20 = KST 04:20
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/sync-videos.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL: ${{ vars.YT_CHANNEL }}
